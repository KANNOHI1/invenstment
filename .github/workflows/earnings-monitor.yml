name: Earnings monitor

on:
  workflow_dispatch:
  schedule:
    # UTC. Run only on known earnings dates/times in the current watch schedule.
    # GitHub cron has no year field, so old entries should be removed after the season.
    - cron: "30 15 11 5 *" # CEG, May 11 2026, after 10:00 ET event
    - cron: "30 21 12 5 *" # OKLO, May 12 2026, after market close / 17:00 ET call
    - cron: "30 12 13 5 *" # NBIS, May 13 2026, after 08:00 ET call start
    - cron: "30 14 13 5 *" # TSEM, May 13 2026, after 10:00 ET call start
    - cron: "30 21 13 5 *" # USAR, May 13 2026, after market close / 17:00 ET call
    - cron: "00 13 14 5 *" # ONDS, May 14 2026, after 08:30 ET call start
    - cron: "00 07 15 5 *" # Kioxia, May 15 2026, after 15:30 JST release
    - cron: "00 22 28 5 *" # NTAP, May 28 2026, after 17:30 ET webcast start

permissions:
  contents: write
  issues: write

concurrency:
  group: earnings-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Poll earnings sources
        run: python scripts/earnings_monitor.py --lookahead-days 0 --lookback-days 0

      - name: Create email notification issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib

          alerts_path = pathlib.Path("research/00_earnings_monitor/earnings_monitor_alerts.json")
          out_dir = pathlib.Path(".tmp_earnings_issues")
          out_dir.mkdir(exist_ok=True)

          data = json.loads(alerts_path.read_text(encoding="utf-8")) if alerts_path.exists() else {"alerts": []}
          grouped = {}
          for alert in data.get("alerts", []):
              key = (alert.get("ticker", "UNKNOWN"), alert.get("expected_date", "unknown-date"))
              grouped.setdefault(key, []).append(alert)

          index_lines = []
          for (ticker, expected_date), alerts in grouped.items():
              title = f"Earnings alert: {ticker} {expected_date}"
              body_path = out_dir / f"{ticker}_{expected_date}.md"
              lines = [
                  f"# Earnings alert: {ticker}",
                  "",
                  f"- Expected date: {expected_date}",
                  f"- Expected time: {alerts[0].get('expected_time', '')}",
                  f"- Priority: {alerts[0].get('priority', '')}",
                  f"- Hill: {alerts[0].get('hill', '')}",
                  "",
                  "## Detected signals",
                  "",
              ]
              for alert in alerts:
                  lines.extend(
                      [
                          f"- `{alert.get('signal', '')}` / {alert.get('label', '')}",
                          f"  - {alert.get('message', '')}",
                          f"  - Source: {alert.get('source_url', '')}",
                      ]
                  )
              lines.extend(
                  [
                      "",
                      "## Next action",
                      "",
                      "Open Codex and ask: `決算通知を見て、公式資料を確認して山別メモに反映して`",
                      "",
                      "Monitor status: `research/00_earnings_monitor/earnings_monitor_status.md`",
                  ]
              )
              body_path.write_text("\n".join(lines), encoding="utf-8")
              index_lines.append(f"{title}\t{body_path}")

          pathlib.Path(".tmp_earnings_issues/index.tsv").write_text("\n".join(index_lines), encoding="utf-8")
          PY

          if [ ! -s .tmp_earnings_issues/index.tsv ]; then
            echo "No earnings alerts to notify."
            exit 0
          fi

          while IFS=$'\t' read -r title body_file; do
            if gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fx "$title" >/dev/null; then
              echo "Issue already exists: $title"
            else
              gh issue create --title "$title" --body-file "$body_file" --assignee "KANNOHI1"
            fi
          done < .tmp_earnings_issues/index.tsv

      - name: Commit monitor output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/00_earnings_monitor/earnings_monitor_status.md research/00_earnings_monitor/earnings_monitor_state.json research/00_earnings_monitor/earnings_monitor_alerts.json
          if git diff --cached --quiet; then
            echo "No monitor changes to commit."
          else
            git commit -m "chore: update earnings monitor"
            git push
          fi
