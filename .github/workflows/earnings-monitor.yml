name: Earnings monitor

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: earnings-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Poll earnings sources
        run: python scripts/earnings_monitor.py --lookahead-days 0 --lookback-days 0

      - name: Create email notification issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib

          alerts_path = pathlib.Path("research/00_earnings_monitor/earnings_monitor_alerts.json")
          out_dir = pathlib.Path(".tmp_earnings_issues")
          out_dir.mkdir(exist_ok=True)

          data = json.loads(alerts_path.read_text(encoding="utf-8")) if alerts_path.exists() else {"alerts": []}
          grouped = {}
          for alert in data.get("alerts", []):
              key = (
                  alert.get("ticker", "UNKNOWN"),
                  alert.get("expected_date", "unknown-date"),
                  alert.get("kind", "earnings"),
              )
              grouped.setdefault(key, []).append(alert)

          index_lines = []
          for (ticker, expected_date, kind), alerts in grouped.items():
              title_prefix = "Earnings alert" if kind == "earnings" else "Research event alert"
              title = f"{title_prefix}: {ticker} {expected_date}"
              body_path = out_dir / f"{ticker}_{expected_date}.md"
              lines = [
                  f"# {title_prefix}: {ticker}",
                  "",
                  f"- Kind: {kind}",
                  f"- Expected date: {expected_date}",
                  f"- Expected time: {alerts[0].get('expected_time', '')}",
                  f"- Priority: {alerts[0].get('priority', '')}",
                  f"- Hill: {alerts[0].get('hill', '')}",
                  "",
                  "## Detected signals",
                  "",
              ]
              for alert in alerts:
                  lines.extend(
                      [
                          f"- `{alert.get('signal', '')}` / {alert.get('label', '')}",
                          f"  - {alert.get('message', '')}",
                          f"  - Source: {alert.get('source_url', '')}",
                      ]
                  )
              lines.extend(
                  [
                      "",
                      "## Next action",
                      "",
                      "Open Codex and ask: `通知を見て、公式資料を確認して山別メモに反映して`",
                      "",
                      "Monitor status: `research/00_earnings_monitor/earnings_monitor_status.md`",
                  ]
              )
              body_path.write_text("\n".join(lines), encoding="utf-8")
              index_lines.append(f"{title}\t{body_path}")

          index_text = "\n".join(index_lines)
          if index_text:
              index_text += "\n"
          pathlib.Path(".tmp_earnings_issues/index.tsv").write_text(index_text, encoding="utf-8")
          PY

          if [ ! -s .tmp_earnings_issues/index.tsv ]; then
            echo "No earnings alerts to notify."
            exit 0
          fi

          while IFS=$'\t' read -r title body_file || [ -n "$title" ]; do
            if gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fx "$title" >/dev/null; then
              echo "Issue already exists: $title"
            else
              gh issue create --title "$title" --body-file "$body_file" --assignee "KANNOHI1"
            fi
          done < .tmp_earnings_issues/index.tsv

      - name: Commit monitor output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/00_earnings_monitor/earnings_monitor_status.md research/00_earnings_monitor/earnings_monitor_state.json research/00_earnings_monitor/earnings_monitor_alerts.json
          if git diff --cached --quiet; then
            echo "No monitor changes to commit."
          else
            git commit -m "chore: update earnings monitor"
            git push
          fi
