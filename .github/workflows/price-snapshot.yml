name: Price snapshot

# 実行環境（Claude Code のコンテナ）からは金融データAPIが egress ポリシーで遮断されるため、
# GitHub Actions のランナー上で株価を取得し、結果をリポジトリにコミットする。
# 更新したいときは watchlist/.price-refresh-trigger を更新して push する。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/price-snapshot.yml"
      - "scripts/fetch_prices.mjs"
      - "scripts/fetch_filings.mjs"
      - "watchlist/.price-refresh-trigger"
      - "watchlist/.scan-tickers"
      - "watchlist/.rotation-tickers"
  # 定時実行は 2026-09-09 に停止した。ローカル移行に伴い、ローカルの取得と
  # Actions の取得が同じブランチの同じJSONを二重に書き換えるのを避けるため。
  # push起点（下の paths）は残してあるので、クラウド側からは
  # watchlist/.price-refresh-trigger を更新して push すれば従来どおり取得できる。
  # ローカル一本化が完了したらこのワークフロー自体を削除してよい。

permissions:
  contents: write

concurrency:
  group: price-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices
        run: node scripts/fetch_prices.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist/
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: update price snapshot"
            git push origin HEAD:${{ github.ref_name }}
          fi
