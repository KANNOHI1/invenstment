name: Price snapshot

# 実行環境（Claude Code のコンテナ）からは金融データAPIが egress ポリシーで遮断されるため、
# GitHub Actions のランナー上で株価を取得し、結果をリポジトリにコミットする。
# 更新したいときは watchlist/.price-refresh-trigger を更新して push する。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/price-snapshot.yml"
      - "scripts/fetch_prices.mjs"
      - "scripts/fetch_filings.mjs"
      - "watchlist/.price-refresh-trigger"
      - "watchlist/.scan-tickers"
      - "watchlist/.rotation-tickers"
  # 定時実行。エージェントが更新を忘れても常に鮮度が保たれる状態にする。
  # 時刻はUTC。日本時間はUTC+9。
  schedule:
    - cron: "5 20 * * 1-5"   # 米国通常取引の終了直後（JST 翌05:05）
    - cron: "5 0 * * 2-6"    # 米国時間外の終了後（JST 09:05）＝日本の朝
    - cron: "0 4 * * 1-5"    # JST 13:00 ＝日本の昼
    - cron: "0 12 * * 1-5"   # JST 21:00 ＝米国寄り付き前、日本の夜

permissions:
  contents: write

concurrency:
  group: price-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices
        run: node scripts/fetch_prices.mjs

      - name: Fetch SEC filings
        run: node scripts/fetch_filings.mjs
        continue-on-error: true

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist/latest_prices.json watchlist/scan_prices.json watchlist/rotation_prices.json watchlist/filings.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: update price snapshot"
            git push origin HEAD:${{ github.ref_name }}
          fi
