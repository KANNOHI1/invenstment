name: Price snapshot

# 実行環境（Claude Code のコンテナ）からは金融データAPIが egress ポリシーで遮断されるため、
# GitHub Actions のランナー上で株価を取得し、結果をリポジトリにコミットする。
# 更新したいときは watchlist/.price-refresh-trigger を更新して push する。

on:
  # 2026-09-10 ローカル一本化に伴い、自動起動を全て止めた。
  # - 定時実行(cron): 2026-09-09 に停止（ローカルの取得と二重になるため）
  # - push起点: 2026-09-10 に停止。クラウドの巡回Routineを無効化したため用途が無くなった一方、
  #   監視対象に .scan-tickers / .rotation-tickers が含まれており、
  #   月初のゼロベース再構築でローカルが編集した瞬間に発火して
  #   株価JSONを二重に書き換える事故になる。
  # 手動実行だけ残す（ローカルが動かないときの退避経路）。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices
        run: node scripts/fetch_prices.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist/
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: update price snapshot"
            git push origin HEAD:${{ github.ref_name }}
          fi
